name: CI/CD - Módulo de Donantes (DonaRed)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------- Etapa 1: Pruebas ----------
  test:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura (umbral 80%)
        run: npm test

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------- Etapa 2: Construcción ----------
  build:
    name: Construcción de la imagen
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Construir imagen Docker
        run: docker build -t donared-donantes-api:${{ github.sha }} .

      - name: Guardar imagen como artefacto
        run: docker save donared-donantes-api:${{ github.sha }} -o donared-image.tar

      - name: Publicar artefacto de construcción
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: donared-image.tar
          retention-days: 7

  # ---------- Etapa 3: Despliegue automático a entorno de prueba ----------
  deploy:
    name: Despliegue a entorno de prueba (staging)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar artefacto de construcción
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Desplegar a entorno de prueba
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "⚠️  STAGING_DEPLOY_HOOK_URL no está configurado como secreto del repositorio."
            echo "Configúralo en Settings → Secrets → Actions apuntando al deploy hook de tu"
            echo "proveedor (Render, Railway, Fly.io, etc.) para activar el despliegue real."
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK_URL"
          echo "✅ Despliegue disparado correctamente en el entorno de prueba."

      - name: Confirmación de despliegue
        run: echo "Commit ${{ github.sha }} desplegado en staging el $(date -u)"
